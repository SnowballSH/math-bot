[project]
name = "math-bot"
version = "0.1.0"
description = "Discord bot for math practice problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # SymPy 1.14's LaTeX parser still requires the 4.11 ANTLR runtime.
    "antlr4-python3-runtime>=4.11,<4.12",
    "discord-py>=2.7.1",
    "jishaku>=2.7.5",
    "python-dotenv>=1.2.2",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord.ext.commands.core",
]

[tool.coverage.run]
source = ["cogs"]
omit = ["cogs/math500/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.basedpyright]
include = ["main.py", "cogs", "tests"]
exclude = [".venv"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnusedCallResult = false
